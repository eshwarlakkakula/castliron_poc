name: Terraform plan

# Runs on every pull request that touches 03-Infra. Plans every layer in
# order for the target environment and posts each layer's plan as a PR
# comment. Never applies - that is terraform-apply.yml's job, gated by a
# GitHub Environment approval.

on:
  pull_request:
    branches: [main]
    paths:
      - "03-Infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan against"
        required: true
        type: choice
        options: [dev, staging, production]
        default: dev

permissions:
  id-token: write # required for AWS OIDC
  contents: read
  pull-requests: write # required to post the plan as a PR comment

env:
  TF_VERSION: "1.9.0"
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  plan:
    name: Plan (${{ matrix.layer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # each layer plans against the already-applied state of the one before it;
      # serialized here to stay well under the AWS/Databricks/Snowflake API
      # rate limits, not because plan (read-only) requires strict ordering
      # the way apply does - see terraform-apply.yml for that.
      matrix:
        layer: [10-foundation, 20-databricks-account, 30-governance, 40-workload-config, 50-interoperability]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt check
        working-directory: 03-Infra
        run: terraform fmt -recursive -check

      - name: Terraform init
        working-directory: 03-Infra/environments/${{ env.TARGET_ENVIRONMENT }}/${{ matrix.layer }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: 03-Infra/environments/${{ env.TARGET_ENVIRONMENT }}/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: 03-Infra/environments/${{ env.TARGET_ENVIRONMENT }}/${{ matrix.layer }}
        env:
          TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          terraform plan -input=false -no-color \
            -var-file="terraform.tfvars" \
            -out=tfplan.binary | tee plan_output.txt

      - name: Post plan to pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('03-Infra/environments/${{ env.TARGET_ENVIRONMENT }}/${{ matrix.layer }}/plan_output.txt', 'utf8').slice(0, 60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — \`${{ env.TARGET_ENVIRONMENT }}\` / \`${{ matrix.layer }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`,
            });
